prog.topics=prog.topics||{};prog.tests=prog.tests||[];prog.read=prog.read||{};
const saveProg=()=>store.set("laTrainer.v2",prog);
function rec(t,ok){const o=prog.topics[t]||(prog.topics[t]={r:0,n:0});o.n++;if(ok)o.r++;saveProg()}

let S={mode:null},timerId=null;
function stopTimer(){if(timerId){clearInterval(timerId);timerId=null}}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function pool(t){return t==="all"?Q:Q.filter(x=>x.topic===+t)}
function topicOptions(sel){return '<option value="all">All topics ('+Q.length+' questions)</option>'+TOPICS.map((n,i)=>'<option value="'+i+'" '+(String(sel)===String(i)?"selected":"")+'>'+esc(n)+' ('+Q.filter(x=>x.topic===i).length+')</option>').join("")}
function fmt(sec){sec=Math.max(0,sec);return String(Math.floor(sec/60)).padStart(2,"0")+":"+String(sec%60).padStart(2,"0")}
function setNav(r){$$("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.r===r))}
function go(r){
  if(S.mode==="test"&&!confirm("Leave the test? Your progress will be lost."))return;
  stopTimer();
  if(r==="home")home();else if(r==="learn")learn();else if(r==="practice")practiceSetup();else if(r==="test")testSetup();
}
$$("#nav button").forEach(b=>b.onclick=()=>go(b.dataset.r));
$("#brand").onclick=()=>go("home");

// ---------- HOME ----------
function home(){
  stopTimer();S={mode:null};setNav("home");
  app.innerHTML=`
  <div class="hero"><h1>Linear Algebra Trainer</h1>
    <p>${Q.length} multiple-choice questions and ${LESSONS.length} short lessons for a first course: vectors, subspaces, matrices, determinants, inverses, row reduction and the Hill cipher.</p>
    <div class="by">Created by <b>Muhammad Qasim Ashfaq</b></div></div>
  <div class="paths">
    <button class="path" data-go="learn"><b>Learn</b><span>${LESSONS.length} lessons with worked examples, one for every topic below.</span></button>
    <button class="path" data-go="practice"><b>Practice</b><span>One question at a time with instant feedback. A hint is always one click away.</span></button>
    <button class="path" data-go="test"><b>Test</b><span>Timed or untimed. Only 5% of the questions offer a hint. You get a score for each topic.</span></button>
  </div>
  <div class="card"><h2>Topics</h2>
    <table class="tlist">${TOPICS.map((n,i)=>{const p=prog.topics[i];return `<tr><td class="num">${i+1}</td><td>${esc(n)}<div class="acc">${Q.filter(x=>x.topic===i).length} questions${p&&p.n?` · ${p.r} of ${p.n} correct so far`:""}</div></td>
      <td class="go"><button class="btn sm" data-l="${i}">Read</button> <button class="btn sm" data-p="${i}">Practice</button></td></tr>`}).join("")}</table></div>`;
  $$(".path").forEach(b=>b.onclick=()=>go(b.dataset.go));
  $$("[data-l]").forEach(b=>b.onclick=()=>learn(+b.dataset.l));
  $$("[data-p]").forEach(b=>b.onclick=()=>practiceSetup(b.dataset.p));
  window.scrollTo(0,0);
}

// ---------- LEARN ----------
function learn(i){
  stopTimer();S={mode:null};setNav("learn");
  if(i==null)i=prog.last||0;
  const les=LESSONS[i],nq=Q.filter(x=>x.topic===i).length;
  prog.read[i]=1;prog.last=i;saveProg();
  app.innerHTML=`<div class="learn">
    <nav class="side">${LESSONS.map((l,k)=>`<button data-k="${k}" class="${k===i?"on":""}"><span class="n">${k+1}</span><span>${esc(l.title)}</span>${prog.read[k]&&k!==i?'<span class="dot">✓</span>':""}</button>`).join("")}</nav>
    <div>
      <select class="mobsel" id="ms" aria-label="Choose a lesson">${LESSONS.map((l,k)=>`<option value="${k}" ${k===i?"selected":""}>${k+1}. ${esc(l.title)}</option>`).join("")}</select>
      <article class="lesson">
        <span class="chip">Lesson ${i+1} of ${LESSONS.length}</span>
        <h2 style="margin-top:8px">${esc(les.title)}</h2>
        <p class="lead">${esc(les.lead)}</p>
        ${rich(les.body)}
        <div class="lnav">
          <button class="btn" id="lp" ${i===0?"disabled":""}>← Previous</button>
          <button class="btn primary" id="lpr">Practice this topic (${nq} questions)</button>
          <button class="btn" id="ln" ${i===LESSONS.length-1?"disabled":""}>Next →</button>
        </div>
      </article></div></div>`;
  $$(".side button").forEach(b=>b.onclick=()=>learn(+b.dataset.k));
  $("#ms").onchange=e=>learn(+e.target.value);
  $("#lp").onclick=()=>learn(i-1);$("#ln").onclick=()=>learn(i+1);
  $("#lpr").onclick=()=>practiceSetup(i);
  window.scrollTo(0,0);
}

// ---------- PRACTICE ----------
function practiceSetup(pre){
  stopTimer();S={mode:null};setNav("practice");
  app.innerHTML=`<div class="narrow"><h1>Practice</h1><p class="sub">Pick a topic and an order. You see the right answer straight after each question.</p>
  <div class="card">
    <label for="pt">Topic</label><select id="pt">${topicOptions(pre==null?"all":pre)}</select>
    <label>Order</label>
    <div class="seg" id="po"><button data-v="seq" class="on">In order</button><button data-v="shuf">Shuffled</button></div>
    <div class="row" style="margin-top:18px"><button class="btn primary" id="go">Start practice</button></div>
    <p class="note">Keyboard: A–D or 1–4 to answer, → for next, ← for previous, H for the hint.</p>
  </div></div>`;
  let order="seq";
  $$("#po button").forEach(b=>b.onclick=()=>{order=b.dataset.v;$$("#po button").forEach(x=>x.classList.toggle("on",x===b))});
  $("#go").onclick=()=>{let list=pool($("#pt").value);if(order==="shuf")list=shuffle(list);startPractice(list)};
}
function startPractice(list){S={mode:"practice",list,i:0,ans:{},hint:{}};renderPractice()}
function renderPractice(){
  const {list,i,ans,hint}=S,Qn=list[i],a=ans[i];
  const done=Object.keys(ans).length,right=Object.keys(ans).filter(k=>ans[k]===list[k].a).length;
  app.innerHTML=`<div class="narrow">
  <div class="row sp"><button class="btn sm" id="exit">← Exit</button><span class="small">${right} correct of ${done} answered</span></div>
  <div class="bar"><i style="width:${(done/list.length)*100}%"></i></div>
  <div class="card">
    <div class="row sp"><span class="chip">${esc(TOPICS[Qn.topic])}</span><span class="small">Question ${i+1} of ${list.length}</span></div>
    <div class="qtext">${R(Qn.q)}</div>
    ${Qn.o.map((t,k)=>{let c="opt";if(a!==undefined){if(k===Qn.a)c+=" right";else if(k===a)c+=" wrong"}return `<button class="${c}" data-k="${k}" ${a!==undefined?"disabled":""}><span class="l">${L[k]}</span><span>${R(t)}</span></button>`}).join("")}
    ${hint[i]?`<div class="hint">Hint: ${R(Qn.h)}</div>`:""}
    ${a!==undefined?`<div class="fb ${a===Qn.a?"ok":"no"}">${a===Qn.a?"Correct.":"Not quite. The answer is "+L[Qn.a]+"."}</div>`:""}
    <div class="row sp" style="margin-top:12px">
      <div class="row"><button class="btn" id="hb" ${hint[i]?"disabled":""}>Show hint</button><button class="btn" id="lr">Read the lesson</button></div>
      <div class="row"><button class="btn" id="pv" ${i===0?"disabled":""}>← Prev</button><button class="btn primary" id="nx">${i===list.length-1?"Finish":"Next →"}</button></div>
    </div>
  </div></div>`;
  $$(".opt").forEach(b=>b.onclick=()=>{if(S.ans[i]!==undefined)return;S.ans[i]=+b.dataset.k;rec(Qn.topic,S.ans[i]===Qn.a);renderPractice()});
  $("#hb").onclick=()=>{S.hint[i]=true;renderPractice()};
  $("#pv").onclick=()=>{S.i--;renderPractice()};
  $("#nx").onclick=()=>{if(i===list.length-1)practiceDone();else{S.i++;renderPractice()}};
  $("#exit").onclick=home;
  $("#lr").onclick=()=>learn(Qn.topic);
}
function practiceDone(){
  const {list,ans}=S;S.mode="done";
  const done=Object.keys(ans).length;
  const missed=list.filter((x,k)=>ans[k]!==undefined&&ans[k]!==x.a);
  const right=done-missed.length;
  app.innerHTML=`<div class="narrow"><div class="card" style="text-align:center"><h2>Practice finished</h2>
  <div class="big">${right} / ${done}</div><p class="sub">answered correctly${list.length-done?` · ${list.length-done} skipped`:""}</p>
  <div class="row" style="justify-content:center">
    ${missed.length?`<button class="btn primary" id="rm">Retry the ${missed.length} I missed</button>`:""}
    <button class="btn ${missed.length?"":"primary"}" id="again">New practice</button><button class="btn" id="hm">Home</button></div></div></div>`;
  if(missed.length)$("#rm").onclick=()=>startPractice(shuffle(missed));
  $("#again").onclick=()=>practiceSetup();$("#hm").onclick=home;
}

// ---------- TEST ----------
function testSetup(){
  stopTimer();S={mode:null};setNav("test");
  app.innerHTML=`<div class="narrow"><h1>Test</h1><p class="sub">Questions are drawn at random. Nothing is marked until you submit.</p>
  <div class="card">
    <label>Scope</label>
    <div class="seg" id="sc"><button data-v="all" class="on">All topics</button><button data-v="one">One topic</button></div>
    <div id="tpw" style="display:none"><label for="tp">Topic</label><select id="tp">${topicOptions(0).replace(/<option value="all">.*?<\/option>/,"")}</select></div>
    <label for="nq">Number of questions <span class="small" id="mx"></span></label>
    <input type="number" id="nq" min="1" value="20">
    <div class="row" style="margin-top:8px" id="qk"></div>
    <label>Mode</label>
    <div class="seg" id="md"><button data-v="timed" class="on">Timed</button><button data-v="untimed">Untimed</button></div>
    <div id="tmw"><label for="tm">Time limit (minutes)</label><input type="number" id="tm" min="1" value="20"><div class="note">The default is one minute per question. Change it if you like.</div></div>
    <div class="hint" id="hn"></div>
    <div class="row" style="margin-top:18px"><button class="btn primary" id="go">Start test</button></div>
  </div></div>`;
  let scope="all",mode="timed",touched=false;
  const maxN=()=>pool(scope==="all"?"all":$("#tp").value).length;
  function upd(){
    const m=maxN(),n=Math.min(Math.max(1,parseInt($("#nq").value)||1),m),hc=Math.floor(n*0.05);
    $("#mx").textContent="(max "+m+")";
    $("#hn").textContent=hc>0?hc+" of your "+n+" questions (5%) will have a hint, chosen at random.":"With "+n+" questions, 5% rounds down to 0, so there will be no hints. Choose 20 or more to get at least one.";
    $("#qk").innerHTML=[10,20,40,m].filter((v,k,a)=>v<=m&&a.indexOf(v)===k).map(v=>`<button class="btn sm" data-n="${v}">${v===m?"All ("+m+")":v}</button>`).join("");
    $$("#qk button").forEach(b=>b.onclick=()=>{$("#nq").value=b.dataset.n;touched=false;upd()});
    if(!touched)$("#tm").value=n;
  }
  $$("#sc button").forEach(b=>b.onclick=()=>{scope=b.dataset.v;$$("#sc button").forEach(x=>x.classList.toggle("on",x===b));$("#tpw").style.display=scope==="one"?"block":"none";upd()});
  $$("#md button").forEach(b=>b.onclick=()=>{mode=b.dataset.v;$$("#md button").forEach(x=>x.classList.toggle("on",x===b));$("#tmw").style.display=mode==="timed"?"block":"none"});
  $("#tp").onchange=()=>{touched=false;upd()};
  $("#nq").oninput=()=>{touched=false;upd()};
  $("#tm").oninput=()=>{touched=true};
  $("#go").onclick=()=>{
    const n=Math.min(Math.max(1,parseInt($("#nq").value)||1),maxN());
    startTest({topic:scope==="all"?"all":$("#tp").value,n,mode,mins:Math.max(1,parseInt($("#tm").value)||n)});
  };
  upd();
}
function startTest(cfg){
  const list=shuffle(pool(cfg.topic)).slice(0,cfg.n),hc=Math.floor(list.length*0.05);
  const hintSet=new Set(shuffle(list.map((_,i)=>i)).slice(0,hc));
  S={mode:"test",list,i:0,ans:{},hintSet,hintUsed:{},timed:cfg.mode==="timed",limit:cfg.mins*60,left:cfg.mins*60,start:Date.now(),cfg};
  stopTimer();renderTest();
  if(S.timed)timerId=setInterval(tick,500);
}
function tick(){
  S.left=S.limit-Math.floor((Date.now()-S.start)/1000);
  const t=$("#tm2");if(t){t.textContent=fmt(S.left);t.classList.toggle("low",S.left<=60)}
  if(S.left<=0)finishTest(true);
}
function renderTest(){
  const {list,i,ans,hintSet,hintUsed}=S,Qn=list[i],a=ans[i],answered=Object.keys(ans).length,hasHint=hintSet.has(i);
  app.innerHTML=`<div class="narrow">
  <div class="row sp"><span class="small">Answered ${answered} of ${list.length}</span>${S.timed?`<span class="timer ${S.left<=60?"low":""}" id="tm2">${fmt(S.left)}</span>`:`<span class="small">Untimed</span>`}</div>
  <div class="bar"><i style="width:${(answered/list.length)*100}%"></i></div>
  <div class="card">
    <div class="row sp"><span class="chip">${esc(TOPICS[Qn.topic])}</span><span class="small">Question ${i+1} of ${list.length}</span></div>
    <div class="qtext">${R(Qn.q)}</div>
    ${Qn.o.map((t,k)=>`<button class="opt ${a===k?"sel":""}" data-k="${k}"><span class="l">${L[k]}</span><span>${R(t)}</span></button>`).join("")}
    ${hintUsed[i]?`<div class="hint">Hint: ${R(Qn.h)}</div>`:""}
    <div class="row sp" style="margin-top:12px">
      ${hasHint?`<button class="btn" id="hb" ${hintUsed[i]?"disabled":""}>Use hint</button>`:`<span class="small">No hint for this question</span>`}
      <div class="row">${a!==undefined?`<button class="btn" id="clr">Clear answer</button>`:""}<button class="btn" id="pv" ${i===0?"disabled":""}>← Prev</button><button class="btn" id="nx" ${i===list.length-1?"disabled":""}>Next →</button></div>
    </div>
  </div>
  <div class="card"><div class="row sp"><b>Questions</b><span class="small">Orange dot = hint available</span></div>
    <div class="pal">${list.map((_,k)=>`<button data-j="${k}" class="${ans[k]!==undefined?"ans":""} ${k===i?"cur":""} ${hintSet.has(k)?"hh":""}">${k+1}</button>`).join("")}</div></div>
  <div class="row sp"><button class="btn" id="quit">Quit test</button><button class="btn primary" id="sub">Submit test</button></div></div>`;
  $$(".opt").forEach(b=>b.onclick=()=>{S.ans[i]=+b.dataset.k;renderTest()});
  if(hasHint)$("#hb").onclick=()=>{S.hintUsed[i]=true;renderTest()};
  $("#pv").onclick=()=>{S.i--;renderTest()};
  $("#nx").onclick=()=>{S.i++;renderTest()};
  if($("#clr"))$("#clr").onclick=()=>{delete S.ans[i];renderTest()};
  $$(".pal button").forEach(b=>b.onclick=()=>{S.i=+b.dataset.j;renderTest()});
  $("#quit").onclick=()=>{if(confirm("Quit the test? Your progress will be lost.")){stopTimer();home()}};
  $("#sub").onclick=()=>{const un=S.list.length-Object.keys(S.ans).length;if(confirm(un?`You have ${un} unanswered question(s). Submit anyway?`:"Submit your test?"))finishTest(false)};
}
function finishTest(auto){
  if(S.mode!=="test")return;
  stopTimer();
  const {list,ans,cfg}=S;
  const elapsed=Math.min(Math.floor((Date.now()-S.start)/1000),S.timed?S.limit:1e9);
  let right=0;const byT={};
  list.forEach((x,i)=>{const ok=ans[i]===x.a;if(ok)right++;const o=byT[x.topic]||(byT[x.topic]={r:0,n:0});o.n++;if(ok)o.r++});
  const pct=Math.round(right/list.length*100),hu=Object.keys(S.hintUsed).length,prev=prog.tests.length?prog.tests[prog.tests.length-1]:null;
  prog.tests.push({pct,n:list.length,d:Date.now()});prog.tests=prog.tests.slice(-20);saveProg();
  S.mode="done";
  const weak=Object.keys(byT).filter(t=>byT[t].r/byT[t].n<0.7);
  app.innerHTML=`<div class="narrow">
  <div class="card" style="text-align:center"><h2>${auto?"Time is up. ":""}Test results</h2>
    <div class="big">${right} / ${list.length}</div>
    <p class="sub">${pct}% · time ${fmt(elapsed)} · hints used ${hu} of ${S.hintSet.size}${prev?` · previous test ${prev.pct}%`:""}</p>
    <div class="row" style="justify-content:center"><button class="btn primary" id="rt">Retake with the same settings</button><button class="btn" id="nt">New test</button><button class="btn" id="hm">Home</button></div></div>
  <div class="card"><h2>By topic</h2><table class="tbl"><tr><th>Topic</th><th>Score</th></tr>
  ${Object.keys(byT).map(t=>`<tr><td>${esc(TOPICS[t])}</td><td>${byT[t].r}/${byT[t].n} (${Math.round(byT[t].r/byT[t].n*100)}%)</td></tr>`).join("")}</table>
  ${weak.length?`<p class="note" style="margin-top:12px">Worth another look:</p><div class="row" style="margin-top:6px">${weak.map(t=>`<button class="btn sm" data-w="${t}">${esc(TOPICS[t])}</button>`).join("")}</div>`:""}</div>
  <div class="card"><div class="row sp"><h2 style="margin:0">Review</h2><div class="seg" id="rf" style="max-width:240px"><button data-v="all" class="on">All</button><button data-v="wrong">Wrong or skipped</button></div></div><div id="rv"></div></div></div>`;
  function rev(f){
    $("#rv").innerHTML=list.map((x,i)=>{const a=ans[i],ok=a===x.a;if(f==="wrong"&&ok)return"";
      return `<div class="rev ${ok?"ok":"no"}"><div class="small">Q${i+1} · ${esc(TOPICS[x.topic])}</div>
      <div style="margin:4px 0">${R(x.q)}</div>
      <div>Your answer: <b>${a===undefined?"skipped":L[a]+". "+R(x.o[a])}</b></div>
      ${ok?"":`<div>Correct answer: <b>${L[x.a]}. ${R(x.o[x.a])}</b></div>`}
      <div class="small">Hint: ${R(x.h)}</div></div>`}).join("")||"<p class='sub'>Nothing to show.</p>";
  }
  rev("all");
  $$("#rf button").forEach(b=>b.onclick=()=>{$$("#rf button").forEach(x=>x.classList.toggle("on",x===b));rev(b.dataset.v)});
  $$("[data-w]").forEach(b=>b.onclick=()=>learn(+b.dataset.w));
  $("#hm").onclick=home;$("#nt").onclick=testSetup;$("#rt").onclick=()=>startTest(cfg);
  window.scrollTo(0,0);
}

// ---------- KEYBOARD ----------
document.addEventListener("keydown",e=>{
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  const tg=e.target.tagName;if(tg==="INPUT"||tg==="SELECT"||tg==="TEXTAREA")return;
  if(S.mode!=="practice"&&S.mode!=="test")return;
  const k=e.key.toLowerCase();
  let idx="abcd".indexOf(k);if(idx<0)idx="1234".indexOf(k);
  if(k.length===1&&idx>=0){const b=$$(".opt")[idx];if(b&&!b.disabled)b.click();return}
  const press=id=>{const b=$(id);if(b&&!b.disabled)b.click()};
  if(e.key==="ArrowRight"||k==="n")press("#nx");
  else if(e.key==="ArrowLeft"||k==="p")press("#pv");
  else if(k==="h")press("#hb");
});

home();
</script>
</body>
</html>
